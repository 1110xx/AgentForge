name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  l1-unit-and-backend-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Sync locked deps
        run: uv sync --all-groups

      - name: L1 unit tests
        run: uv run pytest tests/ -q
        # L2/L3 tests gate themselves off via AGENT_PLATFORM_L2_* env,
        # so this stays green without external Postgres/NATS/MinIO/kind.

      - name: E2E — checkpoint + follow-up chain (SQLAlchemy sqlite L1)
        run: uv run python verify_checkpoint_followup_chain.py --store sqlite

      - name: E2E — checkpoint + follow-up chain (in-memory)
        run: uv run python verify_checkpoint_followup_chain.py --store memory

      - name: E2E — artifact/action events (SQLAlchemy sqlite L1)
        run: uv run python verify_artifact_action_events.py --store sqlite

      - name: E2E — artifact/action events (in-memory)
        run: uv run python verify_artifact_action_events.py --store memory

  frontend-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install workspace deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit + component tests (vitest)
        run: npm test

      - name: Typecheck (all workspaces)
        run: npm run typecheck

      - name: Build (all workspaces)
        run: npm run build

  helm-static-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install helm (no cluster gate: lint + template + schema + YAML)
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Set up Python for YAML manifest parsing
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PyYAML
        run: python -m pip install pyyaml

      - name: Helm static gate
        run: bash scripts/check-k8s.sh

  image-gate:
    # Phase 4.1 (G1): the image publish pipeline. Builds all three production
    # images (control-plane / runtime / frontend) on every run; on main pushes
    # with a registry configured it additionally pushes them and bakes the
    # real content-addressed digests into the golden deploy/prod/values.yaml,
    # committing the update (idempotent: identical content -> identical digest
    # -> no commit -> no re-publish loop). Requisite repo variables/secrets:
    #   vars.AGENT_PLATFORM_REGISTRY             registry host[:port]
    #   secrets.AGENT_PLATFORM_REGISTRY_USERNAME (+ _PASSWORD)
    # Optional mirrors: vars.AGENT_PLATFORM_UV_INDEX_URL / _NPM_REGISTRY_URL.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Build all three images (build-only gate)
        run: bash scripts/build-images.sh

      - name: Publish images + bake golden prod digests (main, registry configured)
        if: github.ref == 'refs/heads/main' && vars.AGENT_PLATFORM_REGISTRY != ''
        env:
          AGENT_PLATFORM_REGISTRY: ${{ vars.AGENT_PLATFORM_REGISTRY }}
          AGENT_PLATFORM_REGISTRY_USERNAME: ${{ secrets.AGENT_PLATFORM_REGISTRY_USERNAME }}
          AGENT_PLATFORM_REGISTRY_PASSWORD: ${{ secrets.AGENT_PLATFORM_REGISTRY_PASSWORD }}
          UV_INDEX_URL: ${{ vars.AGENT_PLATFORM_UV_INDEX_URL }}
          NPM_REGISTRY_URL: ${{ vars.AGENT_PLATFORM_NPM_REGISTRY_URL }}
        run: bash scripts/build-images.sh --push --update-prod-values

      - name: Commit golden prod values (GitOps; skips when digests unchanged)
        if: github.ref == 'refs/heads/main' && vars.AGENT_PLATFORM_REGISTRY != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "agent-platform-image-bot"
          git config user.email "agent-platform-image-bot@users.noreply.github.com"
          if ! git diff --quiet deploy/prod/values.yaml deploy/prod/image-refs.json; then
            git add deploy/prod/values.yaml deploy/prod/image-refs.json
            git commit -m "chore(images): publish control-plane/runtime/frontend digests"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          else
            echo "image refs unchanged; nothing to commit"
          fi