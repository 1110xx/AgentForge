# Production Let's Encrypt issuers — DNS-01 via Cloudflare (validated 2026-09-03)
#
# Real issuance was proven from the local kind cluster (no public endpoint
# needed — DNS-01 only makes outbound ACME/Cloudflare API calls):
#   domain tyx-lab.online · zone active · token scopes Zone:Read + DNS:Read/Edit
#   1) kubectl -n cert-manager create secret generic cloudflare-api-token-secret \
#        --from-literal=api-token=<CF_API_TOKEN>
#   2) kubectl apply -f this file
#   3) Certificate with dnsNames [<host>.tyx-lab.online] -> READY in ~100s
#   4) ingress-shim re-issues agent-platform-api-tls against letsencrypt-prod
#      when the ingress host/issuer annotations point here (verified: served
#      chain leaf <- YR1 <- Root YR(cross) <- ISRG Root X1, strict curl tls=0).
#
# Notes / red lines:
# - Never commit the api token; the Secret is created out-of-band.
# - cert-manager v1.15.3 cleanup is flaky with this provider: issuance is fine
#   but _acme-challenge TXT records may be left in the zone (DELETE path uses
#   an empty zone id -> "zones//dns_records/..." 7003). Sweep them occasionally
#   or upgrade cert-manager. Apex/wildcard dnsNames share _acme-challenge.<apex>
#   and amplify the issue -> prefer host-level certs.
# - email below is the ACME account contact (shown on renewal notices).
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    # TODO: real ACME account email (required by Let's Encrypt).
    email: admin@example.invalid
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token-secret
              key: api-token
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    email: admin@example.invalid
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token-secret
              key: api-token
