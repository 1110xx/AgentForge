# ─────────────────────────────────────────────────────────────────────────────
# ClusterSecretStore — Phase 4.2 (G2) 生产 Secret 实接.
#
# The platform's external-secret-contract.yaml renders an ExternalSecret with
# `storeRefName` / `storeRefKind` / `remoteKey` from the golden values
# (deploy/prod/values.yaml → secrets.storeRefName=enterprise-secret-store,
# storeRefKind=ClusterSecretStore, remoteKey=.enterprise-agent-platform/production,
# where the credential map lives in the kv-v2 engine mounted at secret/). This
# ClusterSecretStore is the other half of that contract: it points ESO at the
# dev Vault (namespace agent-platform-vault, HTTP 8200) using the root token
# from the `agent-platform-vault-token` Secret.
#
# Production swap: replace `provider.vault` with your managed provider (AWS
# Secrets Manager / GCP / HashiCorp Cloud with proper auth) — the ExternalSecret
# and target Secret mapping stay unchanged.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  # Name is the golden contract: deploy/prod/values.yaml
  # secrets.storeRefName=enterprise-secret-store (storeRefKind=ClusterSecretStore)
  # — the chart's ExternalSecret resolves stores by this name, so this CR must
  # carry it verbatim.
  name: enterprise-secret-store
spec:
  # ESO CRD v1beta1 schema: refreshInterval is INTEGER seconds (a "1h" string
  # is rejected at apply time — chart template uses the same integer form).
  refreshInterval: 3600
  provider:
    vault:
      server: http://vault.agent-platform-vault.svc:8200
      path: secret
      version: v2
      auth:
        tokenSecretRef:
          name: agent-platform-vault-token
          key: VAULT_DEV_ROOT_TOKEN
          namespace: agent-platform-vault