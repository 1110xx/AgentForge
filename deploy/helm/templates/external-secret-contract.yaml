{{- if .Values.secrets.externalSecretContract }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: agent-platform-dependencies
  namespace: agent-platform-control
spec:
  # ESO CRD (v1beta1) validation is asymmetric — ExternalSecret.refreshInterval
  # is a STRING duration ("1h"), SecretStore/ClusterSecretStore.refreshInterval
  # is INTEGER seconds. Keep both forms: this template ships "1h" (proven
  # against the live operator in the Phase 4.2 prod-form gate).
  refreshInterval: 1h
  secretStoreRef:
    name: "{{ .Values.secrets.storeRefName }}"
    kind: "{{ .Values.secrets.storeRefKind }}"
  target:
    name: "{{ .Values.secrets.externalSecretName }}"
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: "{{ .Values.secrets.remoteKey }}"
{{- end }}
