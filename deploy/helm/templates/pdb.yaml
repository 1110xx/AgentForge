apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agent-platform-api
  namespace: agent-platform-control
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-platform-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agent-platform-orchestrator
  namespace: agent-platform-control
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-platform-orchestrator
