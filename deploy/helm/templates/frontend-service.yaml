{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: agent-platform-frontend
  namespace: agent-platform-control
  labels:
    app.kubernetes.io/name: agent-platform-frontend
spec:
  selector:
    app.kubernetes.io/name: agent-platform-frontend
  ports:
    # In-cluster the nginx master runs as uid 101 and the namespace enforces
    # PodSecurity restricted (CAP_NET_BIND_SERVICE dropped) — binding the
    # default <1024 port would CrashLoop. The mounted ConfigMap server block
    # listens on 8080 (see frontend-configmap.yaml); the Service keeps the
    # conventional 80 name-side while targeting that high port.
    - port: 80
      targetPort: 8080
      name: http
{{- end }}