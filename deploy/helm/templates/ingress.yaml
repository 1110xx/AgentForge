{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agent-platform-api
  namespace: agent-platform-control
  labels:
    app.kubernetes.io/name: agent-platform-api
  {{- if .Values.ingress.annotations }}
  annotations:
    {{- if .Values.frontend.enabled }}
    # Keep the SSE stream flowing through the ingress for the frontend API
    # path (Phase 3.6).
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    {{- end }}
    {{- if and .Values.ingress.tls.enabled .Values.ingress.tls.clusterIssuer }}
    # cert-manager provisions the TLS secret named
    # {{ .Values.ingress.tls.secretName }} from this issuer (Phase 4.2 G3).
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer | quote }}
    {{- end }}
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
  {{- else if .Values.frontend.enabled }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    {{- if and .Values.ingress.tls.enabled .Values.ingress.tls.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer | quote }}
    {{- end }}
  {{- else if and .Values.ingress.tls.enabled .Values.ingress.tls.clusterIssuer }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer | quote }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api/agent-platform
            pathType: Prefix
            backend:
              service:
                name: agent-platform-api
                port:
                  name: http
          {{- if .Values.frontend.enabled }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agent-platform-frontend
                port:
                  name: http
          {{- end }}
  {{- if and .Values.ingress.tls.enabled .Values.ingress.tls.secretName }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
{{- end }}