apiVersion: batch/v1
kind: Job
metadata:
  name: agent-platform-migrate
  namespace: agent-platform-control
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-platform-migrate
    spec:
      # Hooks run BEFORE main manifests on a fresh install, so a chart-created
      # ServiceAccount (agent-platform-worker, rendered with the Deployments)
      # is not guaranteed to exist when this Job starts. The migrate hook only
      # needs PostgreSQL egress — the namespace `default` SA (token mounting
      # already disabled below) is always present. This also keeps the hook
      # zero-permission by design.
      serviceAccountName: default
      automountServiceAccountToken: false
      restartPolicy: Never
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # No priorityClassName: the class is a chart-rendered cluster-scoped
      # resource, and pre-install hooks run before main manifests — referencing
      # it would FailCreate the hook Job on a fresh install (same class of bug
      # as the ServiceAccount above). A brief alembic hook needs no priority.
      containers:
        - name: migrate
          image: "{{ .Values.images.controlPlane.repository }}@{{ .Values.images.controlPlane.digest }}"
          imagePullPolicy: IfNotPresent
          command: ["/app/backend/.venv/bin/alembic"]
          args: ["-c", "/app/backend/alembic.ini", "upgrade", "head"]
          env:
            - name: AGENT_PLATFORM_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.secrets.externalSecretName }}"
                  key: AGENT_PLATFORM_DATABASE_URL
          resources:
            requests:
              cpu: {{ .Values.controlPlane.migrationResources.requests.cpu }}
              memory: {{ .Values.controlPlane.migrationResources.requests.memory }}
            limits:
              cpu: {{ .Values.controlPlane.migrationResources.limits.cpu }}
              memory: {{ .Values.controlPlane.migrationResources.limits.memory }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
