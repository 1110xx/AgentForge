{{- if .Values.frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-platform-frontend
  namespace: agent-platform-control
  labels:
    app.kubernetes.io/name: agent-platform-frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-platform-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-platform-frontend
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: "{{ .Values.images.frontend.repository }}@{{ .Values.images.frontend.digest }}"
          imagePullPolicy: IfNotPresent
          # PodSecurity restricted (namespace enforces it): the Phase 4.2
          # prod-form gate caught this live — the frontend container lacked
          # the escalation/capability posture, so Pods were rejected by the
          # enforce label. The non-root nginx uid (101) already satisfies
          # runAsNonRoot; add the two remaining restricted requirements.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            # Matches the ConfigMap listener (8080 — see frontend-configmap.yaml;
            # <1024 is denied for uid 101 under restricted PodSecurity). The
            # named port `http` is what readiness/liveness probes target, so it
            # must equal the real listener.
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            httpGet:
              path: {{ .Values.frontend.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.frontend.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.frontend.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.frontend.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.frontend.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.frontend.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.frontend.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.frontend.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.frontend.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.frontend.probes.liveness.failureThreshold }}
          resources:
            requests:
              cpu: {{ .Values.frontend.resources.requests.cpu }}
              memory: {{ .Values.frontend.resources.requests.memory }}
            limits:
              cpu: {{ .Values.frontend.resources.limits.cpu }}
              memory: {{ .Values.frontend.resources.limits.memory }}
      volumes:
        - name: nginx-conf
          configMap:
            name: agent-platform-frontend-nginx
{{- end }}