{{- if .Values.frontend.enabled }}
# Phase 3.6: nginx config for the frontend image — serves the built SPA and
# reverse-proxies SDK traffic to the API Service (SSE kept unbuffered).
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-platform-frontend-nginx
  namespace: agent-platform-control
  labels:
    app.kubernetes.io/name: agent-platform-frontend
data:
  default.conf: |
    # Port 8080, NOT 80: the pod runs nginx as uid 101 inside a restricted
    # namespace (no NET_BIND_SERVICE), so <1024 listeners are denied on the
    # cluster kernel. The frontend Service maps 80 -> 8080 (targetPort).
    server {
      listen 8080;
      server_name _;
      root {{ .Values.frontend.nginx.staticRoot }};
      index index.html;

      location / {
        try_files {{ "$uri" }} {{ "$uri" }}/ /index.html;
      }

      location /api/agent-platform/ {
        # Lazy upstream resolution (variable form) with an explicit resolver:
        # nginx resolves the name at request time against CoreDNS, so the pod
        # is robust to DNS warm-up. The upstream MUST be a FQDN — a bare short
        # name gets no search-domain expansion here (CoreDNS ServFail -> nginx
        # 502). Phase 4.5 sync of the 4.3 runtime fix (18081/18080 all-502
        # incident). Mirrors deploy/images/frontend-default.conf.
        resolver {{ .Values.frontend.nginx.resolver }} valid=30s;
        set $api_upstream http://{{ .Values.frontend.nginx.apiServiceName }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.frontend.nginx.apiPort }};
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        # Prefix adaptation: the SDK base is /api/agent-platform/ while the API
        # router lives under /v1/ — strip the proxy prefix so requests reach
        # the real router (preventive part of the same 4.3 incident).
        rewrite ^/api/agent-platform(/.*)$ {{ "$1" }} break;
        proxy_set_header Host {{ "$host" }};
        proxy_set_header X-Forwarded-For {{ "$proxy_add_x_forwarded_for" }};
        proxy_set_header X-Forwarded-Proto {{ "$scheme" }};
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout {{ .Values.frontend.nginx.proxyReadTimeoutSeconds }}s;
      }
    }
{{- end }}