{{- if .Values.frontend.enabled }}
# Phase 3.6: nginx config for the frontend image — serves the built SPA and
# reverse-proxies SDK traffic to the API Service (SSE kept unbuffered).
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-platform-frontend-nginx
  namespace: agent-platform-control
  labels:
    app.kubernetes.io/name: agent-platform-frontend
data:
  default.conf: |
    server {
      listen 80;
      server_name _;
      root {{ .Values.frontend.nginx.staticRoot }};
      index index.html;

      location / {
        try_files {{ "$uri" }} {{ "$uri" }}/ /index.html;
      }

      location /api/agent-platform/ {
        # Lazy upstream resolution (variable form) — nginx resolves the name at
        # request time, so the pod is also robust to DNS warm-up and the image
        # is usable standalone. Mirrors deploy/images/frontend-default.conf.
        set $api_upstream http://{{ .Values.frontend.nginx.apiServiceName }}:{{ .Values.frontend.nginx.apiPort }};
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host {{ "$host" }};
        proxy_set_header X-Forwarded-For {{ "$proxy_add_x_forwarded_for" }};
        proxy_set_header X-Forwarded-Proto {{ "$scheme" }};
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout {{ .Values.frontend.nginx.proxyReadTimeoutSeconds }}s;
      }
    }
{{- end }}