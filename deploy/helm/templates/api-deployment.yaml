apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-platform-api
  namespace: agent-platform-control
  labels:
    app.kubernetes.io/name: agent-platform-api
spec:
  replicas: {{ .Values.controlPlane.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-platform-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-platform-api
        agent.platform/tokenreview-client: "true"
    spec:
      serviceAccountName: agent-platform-control-plane
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      priorityClassName: agent-platform-control-critical
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: agent-platform-api
      containers:
        - name: api
          image: "{{ .Values.images.controlPlane.repository }}@{{ .Values.images.controlPlane.digest }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: AGENT_PLATFORM_CONTAINER_FACTORY
              value: "{{ .Values.integration.containerFactory }}"
          envFrom:
            - secretRef:
                name: "{{ .Values.secrets.externalSecretName }}"
          readinessProbe:
            httpGet:
              path: {{ .Values.controlPlane.apiProbes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.controlPlane.apiProbes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.controlPlane.apiProbes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.controlPlane.apiProbes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.controlPlane.apiProbes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.controlPlane.apiProbes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.controlPlane.apiProbes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.controlPlane.apiProbes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.controlPlane.apiProbes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.controlPlane.apiProbes.liveness.failureThreshold }}
          resources:
            requests:
              cpu: {{ .Values.controlPlane.apiResources.requests.cpu }}
              memory: {{ .Values.controlPlane.apiResources.requests.memory }}
            limits:
              cpu: {{ .Values.controlPlane.apiResources.limits.cpu }}
              memory: {{ .Values.controlPlane.apiResources.limits.memory }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            {{- if .Values.persistence.localScratch.enabled }}
            - name: local-scratch
              mountPath: /tmp
            {{- else }}
            - name: tmp
              mountPath: /tmp
            {{- end }}
            - name: kubernetes-identity
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        {{- if .Values.persistence.localScratch.enabled }}
        - name: local-scratch
          persistentVolumeClaim:
            claimName: agent-platform-local-scratch
        {{- else }}
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        {{- end }}
        - name: kubernetes-identity
          projected:
            defaultMode: 288
            sources:
              - serviceAccountToken:
                  audience: https://kubernetes.default.svc
                  expirationSeconds: 600
                  path: token
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        apiVersion: v1
                        fieldPath: metadata.namespace
