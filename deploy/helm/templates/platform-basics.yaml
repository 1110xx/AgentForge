apiVersion: v1
kind: Namespace
metadata:
  name: agent-platform-control
  labels:
    agent.platform/plane: control
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: agent-platform-sandbox
  labels:
    agent.platform/plane: sandbox
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-platform-control-plane
  namespace: agent-platform-control
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-platform-orchestrator
  namespace: agent-platform-control
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-platform-worker
  namespace: agent-platform-control
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-platform-sandbox
  namespace: agent-platform-sandbox
automountServiceAccountToken: false
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: agent-platform-control
  namespace: agent-platform-control
spec:
  hard:
    requests.cpu: "20"
    requests.memory: 40Gi
    limits.cpu: "40"
    limits.memory: 80Gi
    pods: "100"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: agent-platform-sandbox
  namespace: agent-platform-sandbox
spec:
  hard:
    requests.cpu: "50"
    requests.memory: 100Gi
    limits.cpu: "100"
    limits.memory: 200Gi
    pods: "{{ .Values.sandbox.maxActiveAttempts }}"
    count/jobs.batch: "{{ .Values.sandbox.maxActiveAttempts }}"
