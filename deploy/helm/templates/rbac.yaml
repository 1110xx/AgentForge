apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-platform-attempt-jobs
  namespace: agent-platform-sandbox
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-platform-orchestrator-attempt-jobs
  namespace: agent-platform-sandbox
subjects:
  - kind: ServiceAccount
    name: agent-platform-orchestrator
    namespace: agent-platform-control
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-platform-attempt-jobs
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-platform-tokenreview
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-platform-control-plane-tokenreview
subjects:
  - kind: ServiceAccount
    name: agent-platform-control-plane
    namespace: agent-platform-control
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-platform-tokenreview
