apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-platform-orchestrator
  namespace: agent-platform-control
  labels:
    app.kubernetes.io/name: agent-platform-orchestrator
spec:
  replicas: {{ .Values.controlPlane.workersReplicas | default 2 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-platform-orchestrator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-platform-orchestrator
    spec:
      serviceAccountName: agent-platform-orchestrator
      automountServiceAccountToken: true
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      priorityClassName: agent-platform-control-critical
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: agent-platform-orchestrator
      containers:
        - name: orchestrator
          image: "{{ .Values.images.controlPlane.repository }}@{{ .Values.images.controlPlane.digest }}"
          imagePullPolicy: IfNotPresent
          command: ["/app/backend/.venv/bin/python"]
          args:
            - "-m"
            - "enterprise_agent_platform.platform.entrypoint"
            - "worker"
          env:
            - name: AGENT_PLATFORM_WORKER_FACTORY
              value: "{{ .Values.integration.workerFactory }}"
            - name: AGENT_PLATFORM_CONTROL_PLANE_URL
              value: http://agent-platform-api.agent-platform-control:8080
            - name: AGENT_PLATFORM_RUNTIME_IMAGE
              value: "{{ .Values.images.runtime.repository }}@{{ .Values.images.runtime.digest }}"
            - name: AGENT_PLATFORM_SANDBOX_NAMESPACE
              value: "{{ .Values.sandbox.namespace }}"
            - name: AGENT_PLATFORM_SANDBOX_SERVICE_ACCOUNT
              value: "{{ .Values.sandbox.serviceAccountName }}"
            - name: AGENT_PLATFORM_SANDBOX_RUNTIME_CLASS
              value: "{{ .Values.sandbox.runtimeClassName }}"
            - name: AGENT_PLATFORM_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.secrets.externalSecretName }}"
                  key: AGENT_PLATFORM_DATABASE_URL
            - name: AGENT_PLATFORM_NATS_URL
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.secrets.externalSecretName }}"
                  key: AGENT_PLATFORM_NATS_URL
            - name: AGENT_PLATFORM_NATS_STREAM
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.secrets.externalSecretName }}"
                  key: AGENT_PLATFORM_NATS_STREAM
            - name: AGENT_PLATFORM_NATS_STREAM_REPLICAS
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.secrets.externalSecretName }}"
                  key: AGENT_PLATFORM_NATS_STREAM_REPLICAS
            {{- if .Values.observability.enabled }}
            - name: AGENT_PLATFORM_OTLP_ENDPOINT
              value: "{{ .Values.observability.otlpEndpoint }}"
            - name: AGENT_PLATFORM_PROMETHEUS_ENABLED
              value: {{ .Values.observability.prometheusExporter | quote }}
            {{- end }}
            - name: AGENT_PLATFORM_JSON_LOGS
              value: {{ .Values.observability.jsonLogs | quote }}
          readinessProbe:
            exec:
              command: {{ .Values.controlPlane.workerProbes.readiness.command | toJson }}
            initialDelaySeconds: {{ .Values.controlPlane.workerProbes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.controlPlane.workerProbes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.controlPlane.workerProbes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.controlPlane.workerProbes.readiness.failureThreshold }}
          livenessProbe:
            exec:
              command: {{ .Values.controlPlane.workerProbes.liveness.command | toJson }}
            initialDelaySeconds: {{ .Values.controlPlane.workerProbes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.controlPlane.workerProbes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.controlPlane.workerProbes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.controlPlane.workerProbes.liveness.failureThreshold }}
          resources:
            requests:
              cpu: {{ .Values.controlPlane.workerResources.requests.cpu }}
              memory: {{ .Values.controlPlane.workerResources.requests.memory }}
            limits:
              cpu: {{ .Values.controlPlane.workerResources.limits.cpu }}
              memory: {{ .Values.controlPlane.workerResources.limits.memory }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
