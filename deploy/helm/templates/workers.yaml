apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-platform-orchestrator
  namespace: agent-platform-control
  labels:
    app.kubernetes.io/name: agent-platform-orchestrator
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-platform-orchestrator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-platform-orchestrator
    spec:
      serviceAccountName: agent-platform-orchestrator
      automountServiceAccountToken: true
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      priorityClassName: agent-platform-control-critical
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: agent-platform-orchestrator
      containers:
        - name: orchestrator
          image: "{{ .Values.images.controlPlane.repository }}@{{ .Values.images.controlPlane.digest }}"
          imagePullPolicy: IfNotPresent
          command: ["/app/backend/.venv/bin/python"]
          args:
            - "-m"
            - "enterprise_agent_platform.platform.entrypoint"
            - "worker"
          env:
            - name: AGENT_PLATFORM_WORKER_FACTORY
              value: "{{ .Values.integration.workerFactory }}"
            - name: AGENT_PLATFORM_CONTROL_PLANE_URL
              value: http://agent-platform-api.agent-platform-control:8080
            - name: AGENT_PLATFORM_RUNTIME_IMAGE
              value: "{{ .Values.images.runtime.repository }}@{{ .Values.images.runtime.digest }}"
            - name: AGENT_PLATFORM_SANDBOX_NAMESPACE
              value: "{{ .Values.sandbox.namespace }}"
            - name: AGENT_PLATFORM_SANDBOX_SERVICE_ACCOUNT
              value: "{{ .Values.sandbox.serviceAccountName }}"
            - name: AGENT_PLATFORM_SANDBOX_RUNTIME_CLASS
              value: "{{ .Values.sandbox.runtimeClassName }}"
            - name: AGENT_PLATFORM_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.secrets.externalSecretName }}"
                  key: AGENT_PLATFORM_DATABASE_URL
            - name: AGENT_PLATFORM_NATS_URL
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.secrets.externalSecretName }}"
                  key: AGENT_PLATFORM_NATS_URL
            - name: AGENT_PLATFORM_NATS_STREAM
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.secrets.externalSecretName }}"
                  key: AGENT_PLATFORM_NATS_STREAM
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
