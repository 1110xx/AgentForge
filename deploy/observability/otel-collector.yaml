        "IsMatch(attributes["http.request.header.authorization"]
        'IsMatch(attributes["agent.prompt"],".+")
        'IsMatch(attributes["tool.payload"],"
attributes/redact:
actions:
3241万5
    (key:http.request.header.authorization,action:delete)
