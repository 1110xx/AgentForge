# Prometheus (metrics store + alert evaluation). Scrapes the OTLP collector's
# merged metrics endpoint (:9464) — every app OTLP metric lands there — plus its
# own scrape. Rule files (prometheus-rules-classic.yaml) drive the business +
# correctness alerts; firing state is queryable at /api/v1/rules (no separate
# Alertmanager in the minimal stack — wire one for external notification).
#
# The rules ConfigMap `agent-platform-prometheus-rules` is created by
# scripts/test-observability.sh from deploy/observability/prometheus-rules-classic.yaml
# (single source of truth), then projected into the container at
# /etc/prometheus/rules/prometheus-rules-classic.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-platform-prometheus
  namespace: agent-platform-observability
  labels:
    app.kubernetes.io/name: agent-platform-prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 30s
    rule_files:
      - /etc/prometheus/rules/prometheus-rules-classic.yaml
    scrape_configs:
      - job_name: otel-collector
        static_configs:
          - targets: ["agent-platform-otel-collector.agent-platform-observability:9464"]
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: agent-platform-prometheus
  namespace: agent-platform-observability
  labels:
    app.kubernetes.io/name: agent-platform-prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-platform-prometheus
  serviceName: agent-platform-prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-platform-prometheus
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=15d
            - --web.enable-lifecycle
          ports:
            - name: http
              containerPort: 9090
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1024Mi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: storage
              mountPath: /prometheus
      volumes:
        - name: config
          projected:
            sources:
              - configMap:
                  name: agent-platform-prometheus
              - configMap:
                  name: agent-platform-prometheus-rules
                  items:
                    - key: prometheus-rules-classic.yaml
                      path: rules/prometheus-rules-classic.yaml
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: agent-platform-prometheus
  namespace: agent-platform-observability
  labels:
    app.kubernetes.io/name: agent-platform-prometheus
spec:
  selector:
    app.kubernetes.io/name: agent-platform-prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http