# Prometheus rule_files (classic) — 1:1 twin of the PrometheusRule CRD
# (deploy/observability/prometheus-rules.yaml), mounted by the gate's
# Prometheus via ConfigMap key "prometheus-rules-classic.yaml".
# Alerts: identical to the CRD. Recording rules: the two SLO burn-ratio
# inputs the CRD's availability alerts reference (5xx share of HTTP RED).
# Generated by scripts/gen-rule-classic.py at 2026-08-27 08:46:16 (UTC).
groups:
- name: agent-platform.correctness
  interval: 15s
  rules:
  - alert: AgentPlatformUnauthorizedWrite
    expr: increase(agent_platform_correctness_violation_total{reason_class="unauthorized_write"}[1m])
      > 0
    for: 0m
    labels:
      severity: page
    annotations:
      summary: Unauthorized WRITE crossed the Tool Gateway boundary.
  - alert: AgentPlatformDuplicateEffect
    expr: increase(agent_platform_correctness_violation_total{reason_class="duplicate_effect"}[1m])
      > 0
    for: 0m
    labels:
      severity: page
    annotations:
      summary: A committed external Effect was observed more than once.
  - alert: AgentPlatformAuditBypass
    expr: increase(agent_platform_correctness_violation_total{reason_class="audit_bypass"}[1m])
      > 0
    for: 0m
    labels:
      severity: page
    annotations:
      summary: A protected state change lacks its atomic audit fact.
  - alert: AgentPlatformStaleFenceWrite
    expr: increase(agent_platform_correctness_violation_total{reason_class="stale_fence_write"}[1m])
      > 0
    for: 0m
    labels:
      severity: page
    annotations:
      summary: A stale Attempt generation changed durable state.
  - alert: AgentPlatformCommittedDataLoss
    expr: sum(increase(agent_platform_correctness_violation_total{reason_class=~"committed_checkpoint_lost|artifact_checksum_mismatch"}[1m]))
      > 0
    for: 0m
    labels:
      severity: page
    annotations:
      summary: A committed Checkpoint or Artifact cannot be read and verified.
  - alert: AgentPlatformCrossTenantAccess
    expr: increase(agent_platform_correctness_violation_total{reason_class="cross_tenant_access"}[1m])
      > 0
    for: 0m
    labels:
      severity: page
    annotations:
      summary: A request crossed its trusted tenant boundary.
  - alert: AgentPlatformMultipleActiveAttempts
    expr: increase(agent_platform_correctness_violation_total{reason_class="multiple_active_attempts"}[1m])
      > 0
    for: 0m
    labels:
      severity: page
    annotations:
      summary: One execution unit has multiple concurrently active Attempts.
- name: agent-platform.slo-burn
  interval: 30s
  rules:
  - alert: AgentPlatformAvailabilityBurnRateFast
    expr: agent_platform:http_error_ratio_5m > (14.4 * 0.001)
    for: 2m
    labels:
      severity: page
    annotations:
      summary: API availability is burning the monthly error budget fast.
  - alert: AgentPlatformAvailabilityBurnRateSlow
    expr: agent_platform:http_error_ratio_6h > (6 * 0.001)
    for: 15m
    labels:
      severity: page
    annotations:
      summary: API availability is burning the monthly error budget at 6x.
- name: agent-platform.business
  interval: 30s
  rules:
  - alert: AgentPlatformRunFailureRatioHigh
    expr: "rate(agent_platform_run_lifecycle_total{state=\"failed\"}[5m])\n/ clamp_min(\n\
      \    rate(agent_platform_run_lifecycle_total{state=~\"succeeded|failed\"}[5m]),\n\
      \    1.0)\n> 0.10\n"
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Run failure ratio exceeded 10% over the last 5 minutes.
  - alert: AgentPlatformQueueBacklogHigh
    expr: agent_platform_queue_backlog > 5
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "Dispatch queue backlog is not draining \u2014 workers or capacity\
        \ are insufficient."
  - alert: AgentPlatformModelErrorRatioHigh
    expr: 'rate(agent_platform_model_errors_total[5m])

      / clamp_min(rate(agent_platform_model_calls_total[5m]), 1.0)

      > 0.20

      '
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Model provider error ratio exceeded 20% over the last 5 minutes.
  - alert: AgentPlatformApiP95LatencyHigh
    expr: "histogram_quantile(0.95,\n  sum by (le) (rate(agent_platform_http_latency_seconds_bucket[5m])))\n\
      > 2.0\n"
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: API p95 latency exceeded 2s over the last 5 minutes.
  - alert: AgentPlatformLeaseExpirySpike
    expr: increase(agent_platform_lease_failures_total{reason_class="lease_expired"}[5m])
      > 0
    for: 0m
    labels:
      severity: warning
    annotations:
      summary: "Runtime lease renewals are expiring \u2014 runners are starving or\
        \ unhealthy."
- name: agent-platform.recording
  interval: 30s
  rules:
  - record: agent_platform:http_error_ratio_5m
    expr: sum(rate(agent_platform_http_latency_seconds_count{http.status_class="5xx"}[5m]))
      / clamp_min(sum(rate(agent_platform_http_latency_seconds_count[5m])), 1.0)
  - record: agent_platform:http_error_ratio_6h
    expr: sum(rate(agent_platform_http_latency_seconds_count{http.status_class="5xx"}[6h]))
      / clamp_min(sum(rate(agent_platform_http_latency_seconds_count[6h])), 1.0)
