# Image-default site: serves the SPA and reverse-proxies SDK traffic to the
# in-cluster API Service. In a Helm deployment the frontend-configmap mounts
# over this file with the same structure (staticRoot/apiService resolved from
# values), so this copy only matters for standalone `docker run` smoke tests.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/agent-platform/ {
        # Lazily resolved (variable form): nginx resolves upstream names at
        # request time, so the image also starts on hosts without the
        # in-cluster DNS entry (standalone smoke runs). In a Helm deployment
        # the ConfigMap mounts the same structure over this file.
        set $api_upstream http://agent-platform-api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE must flow unbuffered (same contract as the Helm ConfigMap).
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}