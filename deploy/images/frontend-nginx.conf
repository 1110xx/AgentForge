# Non-root nginx master config (uid 101). Everything that nginx needs to write
# (pid, logs, temp) lives under /tmp, which the image pre-chowns. The per-site
# server block comes from conf.d/default.conf and is replaced by the Helm
# frontend-configmap in-cluster (same structure, real API service DNS).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    include /etc/nginx/conf.d/*.conf;
}